name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # Antigram ships for Windows + Mac + Linux. We test on Linux (cheap +
        # fast, catches most bugs) and Windows (most users, most surface for
        # path-separator and binary-resolution bugs). Mac added later once
        # we ship a .dmg.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Perl (exiftool needs it on Linux)
        run: perl --version

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Approve esbuild build script
        run: pnpm rebuild esbuild

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Build the sidecar bundle
        run: pnpm build:sidecar

      - name: Build the test fixture
        run: pnpm fixtures:build

      - name: Run all package tests
        run: pnpm -r test

  rust-check:
    name: Cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tauri / Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets
