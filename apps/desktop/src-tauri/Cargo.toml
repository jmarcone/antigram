[package]
name = "antigram"
version = "0.1.0"
description = "Antigram — take your Instagram photos back from Meta."
authors = ["Julian Marcone"]
edition = "2021"
license = "MIT"

[lib]
name = "antigram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
